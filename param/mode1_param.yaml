# Mode 1 (복도 주행) 파라미터 파일

# ---------------- 주행 및 장애물 관련 ----------------
obstacle_stop_dist: 0.20          # m, 전방 장애물 감지 시 정지할 거리
goal_tolerance: 0.05              # m, 웨이포인트에 도달했다고 판단할 반경
front_half_width_deg: 15          # deg, 전방으로 간주할 라이다 좌우 각도
spin_only_angle_thresh_deg: 10.0  # deg, 이 각도 이상 틀어지면 제자리 회전만 수행

# ---------------- I-PD 제어 게인 ----------------
# 선속도(v) 제어 게인
Kp_v: 0.4
Ki_v: 0.05
Kd_v: 0.1

# 각속도(w) 제어 게인
Kp_w: 1.5  # 방향 전환을 더 빠르게 하려면 이 값을 높입니다.
Ki_w: 0.02
Kd_w: 0.05

# ---------------- 최대 속도 제한 ----------------
max_v: 0.2  # m/s
max_w: 1.5  # rad/s, 최대 회전 속도를 높입니다. (기존 0.8 -> 1.5)

# ---------------- 안전 관련 ----------------
odom_timeout: 0.5 # 초, 이 시간 동안 odom 메시지가 없으면 비상 정지

# 라이다 장애물 감지 사용 여부. false로 두면 /lidar/front_points를 구독하지
# 않고 lidar_is_stale/is_obstacle_ahead 체크를 건너뛴다 (odom만으로 주행,
# 라이다 없이 테스트할 때 사용). 실제 운용 시엔 true로 바꿀 것.
use_lidar: false
lidar_front_half_width: 0.15  # m, 전방으로 간주할 좌우 폭 (use_lidar=true일 때만 사용)
lidar_timeout: 0.5            # 초, /lidar/front_points 끊김 판단 기준

# ---------------- 변기 칸 정렬 관련 ----------------
# 위치 도달 순간의 heading 기준 상대 회전 각도 (음수: 시계, 양수: 반시계)
stall_turn_deg: -90.0
# 정렬 완료로 판단할 허용 오차 (라디안)
stall_align_tolerance: 0.03
# 정렬 시 회전 속도 (rad/s)
stall_align_angular_speed: 0.5 # 변기 칸 정렬 시 회전 속도를 높입니다.

# ---------------- 최종 정렬 관련 (원점 복귀 후) ----------------
final_align_tolerance: 0.02
final_align_angular_speed: 0.5 # 최종 정렬 시 회전 속도를 높입니다.

# ---------------- 웨이포인트 목록 ----------------
# [x, y, type] 형식. type: "nav" 또는 "align:<stall_id>"
# odom 좌표계 기준 (로봇 시작 지점이 0,0)
waypoints:
  - [0.420, 0.000, "nav"]      # 포인트1: 복도 꺾이는 지점
  - [0.420, 0.600, "nav"]      # 포인트2: 그 다음 복도 지점(아일 진입)
  - [0.910, 0.600, "align:1"]  # align1: 1번 변기칸 앞 (도착 + 시계 90도 회전)
  - [1.450, 0.600, "align:2"]  # align2: 2번 변기칸 앞 (도착 + 시계 90도 회전) #초기설정: 0.575
  - [1.500, 0.950, "nav"]      # 포인트3: 그 다음 복도 꼭짓점
  - [0.000, 0.950, "nav"]      # 포인트4: 마지막 복도 꼭짓점 #초기설정: 1.000
  - [0.000, 0.000, "nav"]      # 초기위치: 최종 복귀 지점 (odom 원점)